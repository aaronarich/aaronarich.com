title: Aaron A. Rich
description: Front-End Developer working in Atlanta, GA - Specializing in building
  websites and consulting for small businesses.
url: https://aaronarich.com
baseurl: ""
timezone: UTC
author: Aaron A. Rich
github_username: aaronarich
social:
  name: Aaron A. Rich
  links:
    - https://github.com/aaronarich
    - https://instagram.com/aaronarich/

permalink: "/:categories/:year/:month/:title/"
markdown: kramdown

sass:
  style: compressed
  sourcemap: never

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Cloudflare Pages reads security/caching headers from _headers in the build output.
include:
  - _headers

exclude:
  - README.md
  - jekyll.log
  - wrangler.toml
  - scripts/
  - node_modules/
  - vendor/
  - .jekyll-cache/
